<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>윤슬 정원 매니저</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🌿 윤슬 정원 매니저</h1>
<p>분갈이 · 영양제 · 가지치기 관리</p>

</header>

<main>

<div class="grid">

<section class="card">

<h2>🪴 분갈이 흙 계산</h2>

<select id="plant">

<option value="사랑초">사랑초</option>
<option value="수국">수국</option>
<option value="베고니아">베고니아</option>
<option value="스카푸">스카푸</option>
<option value="미니신닌기아">미니신닌기아</option>

</select>

<input id="pot" placeholder="화분 용량 (L)">

<button onclick="calcSoil()">흙 계산하기</button>

<div id="soilResult"></div>

</section>

<section class="card">

<h2>🌱 영양제 재사용</h2>

<select id="fert">

<option>아그로믹파워</option>
<option>멀티코트</option>
<option>오스모코트</option>
<option>골드아이언</option>
<option>벅스킬</option>
<option>토탈싹</option>

</select>

<button onclick="calcFert()">다음 사용일</button>

<div id="fertResult"></div>

</section>

<section class="card">

<h2>✂️ 가지치기 팁</h2>

<button onclick="showPrune()">관리 팁 보기</button>

<div id="tipResult"></div>

</section>

</div>

</main>

<footer>

윤슬 Garden Manager v13

</footer>

<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
