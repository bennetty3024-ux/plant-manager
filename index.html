<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>윤슬 정원 매니저 PRO</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🌿 윤슬 정원 매니저</h1>
<p>식물관리 · 분갈이 · 영양제</p>

</header>

<nav>

<button onclick="showPage('dashboard')">대시보드</button>
<button onclick="showPage('plants')">식물등록</button>
<button onclick="showPage('log')">작업기록</button>
<button onclick="showPage('soil')">분갈이계산</button>
<button onclick="showPage('schedule')">관리일정</button>

</nav>

<main>

<section id="dashboard" class="page">

<h2>오늘 관리</h2>

<div id="todayTasks"></div>

</section>

<section id="plants" class="page hidden">

<h2>식물 등록</h2>

<input id="plantName" placeholder="식물 이름">

<select id="plantType">

<option>사랑초</option>
<option>수국</option>
<option>베고니아</option>
<option>미니신닌기아</option>
<option>구근류</option>
<option>팬지</option>

</select>

<button onclick="addPlant()">식물 추가</button>

<div id="plantList"></div>

</section>

<section id="log" class="page hidden">

<h2>작업 기록</h2>

<select id="logPlant"></select>

<select id="logType">

<option>분갈이</option>
<option>정식</option>
<option>파종</option>
<option>가지치기</option>
<option>영양제</option>
<option>토양살충제</option>
<option>벅스킬</option>

</select>

<textarea id="logMemo" placeholder="메모"></textarea>

<button onclick="saveLog()">기록 저장</button>

<div id="logList"></div>

</section>

<section id="soil" class="page hidden">

<h2>분갈이 흙 계산</h2>

<select id="soilPlant">

<option>사랑초</option>
<option>수국</option>
<option>베고니아</option>

</select>

<input id="potSize" placeholder="화분 용량 L">

<button onclick="calcSoil()">계산</button>

<div id="soilResult"></div>

</section>

<section id="schedule" class="page hidden">

<h2>관리 일정</h2>

<div id="scheduleList"></div>

</section>

</main>

<footer>

윤슬 Garden Manager PRO

</footer>

<script src="app.js"></script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js')
}
</script>

</body>
</html>
